version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      exclude:
        - "@mdn/*"

  - package-ecosystem: npm
    directory: "/api"
    schedule:
      interval: weekly
    cooldown:
      exclude:
        - "@mdn/*"

  - package-ecosystem: npm
    directory: "/updates"
    schedule:
      interval: weekly
    cooldown:
      exclude:
        - "@mdn/*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci(deps): "
